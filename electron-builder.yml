appId: de.m3connect.tessera
productName: tessera
copyright: tessera contributors

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - '!**/*.map'
  - '!**/*.ts'

# --- Fuses -------------------------------------------------------------------
# Switches compiled into the Electron binary itself, flipped at packaging time, so that nothing a
# launcher can set — an environment variable, a command-line flag — turns the shipped browser into
# something else. Development builds run the unflipped binary from node_modules and are unaffected.
#
# Off, because each one is a way to run arbitrary code as this browser without touching its files:
# `ELECTRON_RUN_AS_NODE=1` makes the executable a plain Node interpreter, `NODE_OPTIONS` injects
# `--require` into the main process, and Node's inspect switches open a debugger on it. Nothing in
# this repository uses any of them. Chromium's own remote debugging switches are not a fuse;
# `refusedDebugSwitch` in `src/main/startup-flags.ts` closes those.
#
# On: cookie encryption is a one-way transition — existing plaintext cookies are encrypted on write,
# and switching the fuse back off later leaves an unreadable cookie store — accepted deliberately,
# because a browser whose cookie jar is readable by any process running as the user is not
# privacy-first. The two asar fuses make the archive the only place app code can come from, and
# check its integrity on load (macOS and Windows; Linux ignores both, harmlessly).
#
# `resetAdHocDarwinSignature` because the macOS build is not signed with a Developer ID: flipping a
# fuse changes the binary, and on Apple Silicon a binary whose ad-hoc signature no longer matches
# does not launch.
#
# `grantFileProtocolExtraPrivileges` is left at its default on purpose. The chrome UI loads from
# `file://` (`BrowserWindowController.#loadChrome`), and turning the fuse off before that UI moves to
# a scheme of its own is the change most likely to leave the packaged window blank. The cost of
# leaving it — a `file://` document in a tab can `fetch` its neighbours — is recorded under Risks and
# Open Questions in `docs/plans/2026-09-23-002-fix-review-hardening-plan.md`.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  resetAdHocDarwinSignature: true

# Every platform is a first-class target (spec 7): same feature set, built and
# shipped in the format that platform's users expect.

# --- Windows -----------------------------------------------------------------
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  # Named explicitly rather than left to discovery: electron-builder looks for an
  # `icons` directory before `icon.png`, and would then derive the .ico from the
  # largest file in build/icons (512) instead of the 1024 master.
  # Both files come from `node scripts/make-icon.mjs`.
  icon: build/icon.png
  # Authenticode signing. Set WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD in CI, or
  # point signtoolOptions at an HSM/Azure Trusted Signing profile.
  signtoolOptions:
    signingHashAlgorithms: [sha256]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Needed so Windows offers tessera in "Default apps".
  include: build/installer.nsh

# --- Linux -------------------------------------------------------------------
linux:
  # AppImage only, and both architectures.
  #
  # `.deb` and `.rpm` were here and are gone by decision. Both require a package *maintainer*, which
  # electron-builder derives from `author.email` — and there is no address to put there that would not be
  # wrong: the one in git points at an employer that was explicitly declined as this project's author, and
  # a placeholder nobody reads is worse in a shipped package than a missing package, because a user who
  # writes to it gets silence instead of an answer.
  #
  # AppImage needs no maintainer, runs on any distribution without being installed, and is the Linux format
  # `electron-updater` handles most reliably. When there is a real address to stand behind, the two targets
  # come back in one line each.
  target:
    - target: AppImage
      arch: [x64, arm64]
  # A directory, because Linux installs one file per hicolor size rather than one
  # multi-resolution container.
  icon: build/icons
  category: Network;WebBrowser
  synopsis: Privacy-first browser with split view
  desktop:
    entry:
      MimeType: x-scheme-handler/http;x-scheme-handler/https;text/html;application/xhtml+xml
      Categories: Network;WebBrowser
      StartupWMClass: tessera
      StartupNotify: 'true'
# The dependency lists for `.deb` and `.rpm`, kept although neither is built any more — see the note on
# `linux.target`. They are inert without a target, and they are the part that took research: getting one of
# these wrong produces a package that installs and then fails to start. Deleting them would mean working
# them out again the day there is a maintainer address.
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0
rpm:
  depends:
    - libXScrnSaver
    - libsecret

# --- macOS -------------------------------------------------------------------
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  # electron-builder converts this to the .icns itself; 1024 is what the Retina slot
  # needs, so the master is named rather than the smaller files in build/icons.
  icon: build/icon.png
  category: public.app-category.productivity
  darkModeSupport: true
  # Hardened runtime + notarization are mandatory: without them Gatekeeper
  # blocks the app outright (spec 7).
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  extendInfo:
    NSHumanReadableCopyright: tessera contributors
    CFBundleURLTypes:
      - CFBundleURLName: Web site URL
        CFBundleURLSchemes: [http, https]
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# --- Updates -----------------------------------------------------------------
# GitHub Releases, by decision — and the earlier claim here has been withdrawn rather than quietly
# left standing. This block used to name a self-hosted generic feed with the comment "no third
# party learns who is running the browser"; that feed did not exist (`updates.tessera.invalid`,
# a reserved TLD) and the sentence was therefore a promise about software nobody had written.
#
# With GitHub as the source, GitHub sees the IP address, the version and, in aggregate, how many
# people run this browser, on every check. That is the honest cost and it belongs written down here
# rather than discovered later. What limits it: the check is one request to one host, it carries no
# identifier of ours, and it is a setting the user can switch off. What would remove it is a feed
# under our own control — the provider is per-channel configurable, so that is a config change and
# not a rewrite.
#
# `releaseType: prerelease` because the current channel is alpha: a published build must not present
# itself to a stable user as the newest release. `electron-builder --publish always` creates the
# release and uploads both the installers and the `latest*.yml` files that the updater reads.
publish:
  - provider: github
    owner: Maniksz
    repo: Tessera-Privacy-and-Productivity-Browser
    releaseType: prerelease
