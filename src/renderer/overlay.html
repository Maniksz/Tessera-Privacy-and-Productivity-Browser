<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The overlay layer is our own code, but it is still rendered by a browser engine, so it
      gets the same restrictive policy as the chrome UI (spec 6). No remote origins, no
      inline script, no eval.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>tessera overlay</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/overlay.tsx"></script>
  </body>
</html>
