<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      No remote origin, no connection, nothing to submit.

      The page states three facts that are all in its own bundle, and it is served without a bridge, so
      there is nothing for it to fetch and nobody for it to talk to. A policy that permitted either would
      only be room for a mistake.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <!-- A placeholder, replaced from the bundled catalogue as soon as the page runs. -->
    <title>About</title>
  </head>
  <body>
    <div id="about-root"></div>
    <script type="module" src="./about.tsx"></script>
  </body>
</html>
