<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      No remote origin at all.

      The list names files the user fetched and the sites they came from, so any permitted
      outside origin would turn this page into a way to report that. `form-action 'none'` matters
      here in particular: the page has a real `<form>` for nothing, and a policy that allowed a
      submission would allow a crafted one.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: tessera:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Downloads</title>
  </head>
  <body>
    <div id="downloads-root"></div>
    <script type="module" src="./downloads.tsx"></script>
  </body>
</html>
