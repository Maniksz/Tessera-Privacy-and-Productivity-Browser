<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      No remote origin at all, not even for images.

      This page lists every address the user has visited. A policy that permitted any outside
      origin would make the page itself a way to leak that list — one request per favicon would
      tell a third party the whole history. `tessera:` is allowed for images so the local
      favicon cache can be shown; nothing else is.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: tessera:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>History</title>
  </head>
  <body>
    <div id="history-root"></div>
    <script type="module" src="./history.tsx"></script>
  </body>
</html>
