<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The tightest policy of any page in this browser, and every directive earns its place.

      This document holds the user's credentials. `connect-src 'none'` means no script here can send
      anything anywhere — not to a remote host, and not to a local one either, so a compromised
      dependency in this bundle has no channel out. `img-src` is `'self'` and `data:` only: unlike the
      history page there is nothing here worth a favicon, and one request per row would tell a third
      party the list of sites the user has accounts with, which is a worse leak than the visit list.
      `form-action 'none'` because the page has no form to submit and a policy that permitted one
      would permit posting the fields it does have.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>Passwords</title>
  </head>
  <body>
    <div id="passwords-root"></div>
    <script type="module" src="./passwords.tsx"></script>
  </body>
</html>
