<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The chrome UI is our own code, but it is still rendered by a browser
      engine, so it gets a restrictive policy too (spec 6). No remote origins,
      no inline script, no eval.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: tessera:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>tessera</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
