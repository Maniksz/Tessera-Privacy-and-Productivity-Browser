# Builds and publishes a release when a version tag is pushed.
#
#   git tag v0.1.1-alpha.0 && git push --follow-tags
#
# ## Why this exists rather than only the local `pnpm release:alpha`
#
# Two reasons, and neither is convenience.
#
# **No token on anybody's machine.** Creating a GitHub release is the REST API over HTTPS, and an SSH
# key cannot authenticate it — so a local publish needs a personal access token, which then has to live
# somewhere on disk. Here the token is `secrets.GITHUB_TOKEN`, which GitHub mints for this run, scopes to
# this repository and destroys when the job ends. Nothing to store, nothing to leak, nothing to rotate.
#
# **A local release is incomplete by construction.** `electron-builder` can only package for the platform
# it runs on, so a release cut on a Mac carries `latest-mac.yml` and nothing else — and Windows and Linux
# users then never see an update, because the file their updater reads was never uploaded. That is not a
# missing nicety; it is a release that silently does not work for two thirds of the platforms this browser
# claims to support. Three runners are the only way to produce all three feeds.
name: Release

on:
  push:
    tags:
      - 'v*'

# The only permission the job needs: create a release and attach files to it. Everything else stays
# read-only, so a compromised dependency in a build cannot rewrite the repository.
permissions:
  contents: write

jobs:
  # The gates, once, before anything is published.
  #
  # Once and not per platform, and that is a correction rather than a saving. Run on all three, the suite
  # failed on Windows — not on anything about the product, but on four assertions that read a file's POSIX
  # mode, which Windows does not have. So a release with no `.exe` was produced by a *test* that could never
  # have passed there, and the Windows job died before it built anything.
  #
  # These are pure-logic tests over shared modules; there is nothing platform-specific for them to catch that
  # three runs would find and one would not. What *is* platform-specific is the build, and that still happens
  # on each.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm test

  # The release itself, created exactly once before anything uploads into it.
  #
  # ## The defect this fixes
  #
  # The three publish jobs below run in parallel, and each one ran `electron-builder --publish always`
  # against a release that did not exist yet. So all three asked GitHub "is there a release for this
  # tag?", all three were told no, and all three posted one. One won; the others got
  # `422 already_exists` and failed *after* having built their installers — a green build discarded at
  # the last step, and a release carrying one platform's feed instead of three.
  #
  # It is a race, so it fails by timing rather than reliably: the log of the losing job still says
  # "creating GitHub release reason=release doesn't exist", because that check happened before the
  # winner's release existed. The Linux job failed twice over for the same reason at a smaller scale —
  # x64 and arm64 upload as two parallel tasks inside the one process, so both posted too.
  #
  # ## Why a job rather than serialising the matrix
  #
  # `max-parallel: 1` would also work and costs three sequential platform builds, each with its own
  # Electron download — the slowest possible fix for a problem that is one API call. Creating the
  # release up front leaves the builds parallel and turns every publish step into what it should have
  # been: an upload into something that already exists.
  release:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      # Shallow, because nothing here reads history — `gh` needs the repository context and no more.
      - uses: actions/checkout@v4

      - name: Create the release if it is not there yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Idempotent on purpose: re-running a partly failed release must not fail here, and a release
        # created by an earlier attempt is left exactly as it is rather than replaced — its assets may
        # already be attached.
        #
        # `--prerelease` matches `releaseType: prerelease` in `electron-builder.yml`. The two have to
        # agree: a stable release created here would present an alpha to stable users as the newest
        # version, which is the thing that setting exists to prevent.
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists, leaving it untouched"
            exit 0
          fi
          gh release create "$tag" --prerelease --title "$tag" --generate-notes

  publish:
    # Nothing is published unless the gates passed. A release cannot be taken back once a browser has
    # updated to it, so this is the place where being slow is correct.
    #
    # And not until the release exists, so these three only ever upload into it.
    needs: [gates, release]
    strategy:
      # Deliberately not fail-fast. One platform's build failing must not cancel the other two — a release
      # with two of three feeds is worth having and can be completed by re-running one job, whereas a
      # cancelled matrix leaves a half-published release nobody can reason about.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Pinned to what this repository is developed with. A different pnpm resolves the lockfile
          # differently, and a release built from other dependencies than the tests ran against is a
          # release nobody has tested.
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm run build` is `typecheck && electron-vite build`, so it type-checks on this platform *and*
      # produces `out/`. It has to be here rather than only in the gates job: `electron-builder.yml` takes
      # `out/**/*` as its input, and the first version of this workflow ran the checks and then packaged
      # **without ever building** — which would have published a release that looks complete, downloads,
      # installs, and contains no application.
      - run: pnpm run build

      # And a guard against the same class of mistake arriving another way — a build that succeeds and
      # emits nothing, a changed output directory, a `files` glob that stops matching. Cheap, and it turns
      # a silently empty release into a failed job.
      - name: Check that there is something to package
        shell: bash
        run: |
          test -f out/main/index.js || { echo "out/main/index.js is missing; nothing was built"; exit 1; }
          test -d out/renderer || { echo "out/renderer is missing; nothing was built"; exit 1; }

      # The smoke checks are deliberately *not* run here. They drive a real browser window, which needs a
      # display; more to the point, their value is in a human seeing where a drag went. See
      # `scripts/smoke-checks.mjs`.

      - name: Publish
        # `--publish always` is what generates and uploads `latest*.yml` next to the installers. Without
        # those files the release is a set of downloads that no running browser will ever notice.
        #
        # macOS is built unsigned until there is a Developer ID: `notarize` and a hardened runtime are
        # asked for in `electron-builder.yml`, and without credentials the build fails at the signing step.
        # The consequence is stated here rather than discovered later — **Squirrel.Mac will not replace an
        # unsigned application**, so a mac alpha from this workflow installs by hand and cannot update
        # itself. Removing the two overrides is the whole change once the certificate exists.
        run: >
          pnpm exec electron-builder ${{ matrix.target }}
          ${{ matrix.os == 'macos-latest' && '--config.mac.notarize=false --config.mac.identity=null' || '' }}
          --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
